; MXRider - offline AI rider for MX Simulator
; Drop this file next to mx.exe, beside opengl32.dll and ViGEmClient.dll.
; Edited by hand; F9 reloads it in game. Semicolons start a comment.

[General]
; Start the rider driving? Leave 0 and press F7 when you are in a race, so nothing is pressed in
; the menus. F6 cycles the mode, F5 records the racing line, F9 reloads this file.
Enabled=0
ToggleKey=0x76          ; F7  rider on / off
ModeKey=0x75            ; F6  off -> baseline -> record-line -> policy -> off
LineKey=0x74            ; F5  start / stop recording the line
ReloadKey=0x78          ; F9  reload ini, line and policy
; off | baseline | record-line | policy
Mode=baseline           ; F7 then only has to enable it: with mode=off F7 looks broken
; Where the run logs, the line and the policy live. Blank = this file's folder.
LogDirectory=

[Detection]
; How the bike is found. These names are what MX Simulator's shaders use; only change them if a
; different game build renames them (the log prints every uniform the game looks up).
ModelviewUniform=u_modelview
TerrainUniform=u_heights
BoneUniform=u_bone_t     ; a uniform only the skinned bike / rider models have
ProjectionUniform=u_projection   ; the camera projection, for where things land on screen
BikeSearchRadius=20.0   ; how far from the camera the bike is drawn: a chase camera sits about
                        ; ten units behind it, and the bike was outside the old 6-unit search
TeleportDistance=5.0    ; a jump this far is a respawn, not travel
WorldUp=0,1,0

[Line]
ResumeUpright=0.90    ; how upright the bike must be before the rider drives again; 0.6 was still leaning
ResumeSettle=0.30     ; ...and stay that upright this many seconds, so it never launches mid-fall
; The racing line the baseline follows, recorded by driving one lap in record-line mode.
File=mxrider_line.csv
Lookahead=45.0           ; units ahead the steering aims at; it also grows with speed (6 + 0.7 v)
; TargetSpeed is a straight-line ceiling now, not the speed for the whole lap: the corner settings
; below decide the rest, so this can be much higher than the old one-number-for-everything 27.
; Raise it until the bike runs wide on the fastest straight, then come back down a notch.
TargetSpeed=52.0
SteerGain=0.30            ; per radian of heading error; 0.6 still saturated the stick in 42% of frames
CrossGain=0.04          ; per unit of sideways offset, capped at 8 units so it stays a nudge
YawDamp=0.15            ; counter-steer per rad/s of yaw; arrests a slide instead of letting it spin
SpeedGain=0.30            ; throttle / brake per unit of speed error; brakes a little earlier off the top speed
; Cornering. Every bend within BrakeReach sets the speed the bike must already be down to:
; v = sqrt(CornerGrip * radius + 2 * BrakeDecel * distance). 26 is roughly what held grip at 27.
CornerGrip=26.0
BrakeDecel=22.0          ; weaker than the bike can really brake, so it starts early instead of late
BrakeReach=120.0         ; units of line looked along; shorten only if it brakes far too early
RearBrakeShare=0.25      ; part of the braking on the rear wheel, which keeps the bike turning in
MaxSteerRate=8.0         ; stick units per second; full lock in about 0.12 s, and no jitter
MaxThrottleRate=6.0      ; trigger units per second
MinSpeed=8.0             ; never slower than this, however tight the bend
LeanGain=0.000           ; leave the lean axis centred; any rider weight shift at this stage shows up as dabbing and sitting

[Pad]
; Which control of the virtual pad carries which input. Bind the game's own controller settings to
; match this, or change these values to match what the game already expects.
; FrontBrakeTrigger: 0 = left trigger, 1 = right trigger (the other one is always throttle).
FrontBrakeTrigger=0
; XUSB button bits: A=0x1000 B=0x2000 X=0x4000 Y=0x8000 LB=0x0100 RB=0x0200
RearBrakeButton=0x2000
ClutchButton=0x1000
ShiftUpButton=0x0200
ShiftDownButton=0x0100
StickDeadzone=0.02

[Policy]
; Written by train/: the exported network. Missing or malformed means the rider falls back to the
; baseline, and with no line either it does nothing.
File=mxrider_policy.txt

[Log]
Csv=1
FlushSeconds=2.0
; Reference speed that counts as 1.0 in observations and reward (game units are not metres:
; the camera moves about 65 units/s at a displayed ~39).
RefSpeed=30.0
MaxEpisodeSeconds=120
